<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S2 overlay a11y check (spike)</title>
<style>
:root{--ink:#1a1a17;--paper:#f3f1ec}
body{margin:0;font:16px/1.4 Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:16px}
figure{margin:0;position:relative}
figure img{display:block;width:100%;height:auto}
.badge{position:absolute;left:8px;top:8px;margin:0;padding:4px 8px;background:rgba(18,16,14,.72);color:#fff;font-size:14px}
.cap{position:absolute;left:8px;bottom:8px;margin:0;color:#fff;font-size:16px;font-weight:700}
figcaption{padding:6px 0}
</style></head>
<body><main>
<figure><img src="out/clay-flat.webp" alt="Illustrative reconstruction of a gymnasium-like room in grey clay tones. A framed archival photograph of two men on a rock ledge stands left of centre."><p class="badge">Illustrative reconstruction</p><p class="cap">Framed photograph</p><figcaption>Clay</figcaption></figure>
<figure><img src="out/lowpoly-flat.webp" alt="The same room in flat-shaded low-poly style with a cream, walnut and oxblood palette."><p class="badge">Illustrative reconstruction</p><p class="cap">Framed photograph</p><figcaption>Low-poly</figcaption></figure>
<figure><img src="out/toon-flat.webp" alt="The same room drawn with cel shading and dark outlines."><p class="badge">Illustrative reconstruction</p><p class="cap">Framed photograph</p><figcaption>Toon</figcaption></figure>
<figure><img src="out/duotone-flat.webp" alt="The same room in a two-tone ordered-dither print look matching the photograph's tones."><p class="badge">Illustrative reconstruction</p><p class="cap">Framed photograph</p><figcaption>Duotone dither</figcaption></figure>
</main></body></html>
